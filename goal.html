    <link rel="stylesheet" href="css/custom.css">
    <!-- Google tag：GA4 與 Google Ads -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-04LJ9PZG1F"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-04LJ9PZG1F');
      gtag('config', 'AW-18338774301');
    </script>
  </head>
  <body class="inquiry-page">
    <nav class="navbar navbar-expand-lg sticky-top navbar-dark studio-nav">
      <div class="container">
        <a class="navbar-brand" href="index.html" aria-label="夢境影像 Dream Creation Studio 首頁"><span class="brand-mark">DC</span><span class="brand-text">DREAM CREATION<br>STUDIO</span></a>
        <a class="btn btn-outline-light" href="index.html">回到首頁</a>
      </div>
    </nav>

    <main>
      <section class="inquiry-hero">
        <div class="container">
          <p class="section-kicker">THANK YOU</p>
          <h1 id="completionTitle" class="display-title">詢價內容已完成送出流程。</h1>
          <p id="completionMessage" class="lead-copy">感謝提供專案資訊，我們已記錄這次詢價完成動作。</p>
          <p id="demoNotice" class="form-note mt-4">目前網站尚未串接正式收件服務，資料沒有離開你的裝置；這個頁面目前用於測試轉換追蹤。</p>
          <a class="btnstyle mt-4" href="index.html">返回首頁</a>
          <a class="btnstyle mt-4 ms-2" href="inquiry.html">填寫另一筆詢價</a>
        </div>
      </section>
    </main>

    <footer class="site-footer"><div class="container"><div class="copyright mt-0"><span>© 2026 Dream Creation Studio. All Rights Reserved.</span></div></div></footer>
    <script>
      (function () {
        var transactionId = new URLSearchParams(window.location.search).get('transaction_id');
        var pending;

        try {
          pending = JSON.parse(sessionStorage.getItem('pending_inquiry_conversion'));
        } catch (error) {
          pending = null;
        }

        if (!pending || !transactionId || pending.transactionId !== transactionId) {
          document.getElementById('completionTitle').textContent = '尚未完成詢價流程。';
          document.getElementById('completionMessage').textContent = '請先填寫詢價表單；直接開啟完成頁不會記錄 Google Ads 轉換。';
          return;
        }
        sessionStorage.removeItem('pending_inquiry_conversion');

        if (typeof gtag === 'function') {
          gtag('event', 'generate_lead', {
            service_type: pending.serviceType,
            form_status: 'demo_validated',
            transaction_id: transactionId
          });
          gtag('event', 'conversion', {
            send_to: 'AW-18338774301/4V5XCNqThNOcFJ36zahE',
            value: 1.0,
            currency: 'TWD',
            transaction_id: transactionId
          });
        }
      }());
    </script>
    <script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
